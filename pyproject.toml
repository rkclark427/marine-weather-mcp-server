[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-wx-mcp"
version = "0.1.0"
description = "Local MCP server exposing marine weather (NWS, NDBC, Open-Meteo, Windy), aids to navigation (NAVCEN), and Coast Pilot data for sailing passage planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "tzdata; sys_platform == 'win32'",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
marine-wx-mcp = "marine_wx_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marine_wx_mcp = ["registry.json"]
